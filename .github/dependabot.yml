# 依存ライブラリ・GitHub Actions・Docker イメージの更新を、毎週まとめてプルリクエストにする（OP-10）。
# CI の受入テストと画面の通しテストが通ったものを、作成者が確認して取り込む（勝手には取り込まれない）。
version: 2
updates:
  - package-ecosystem: npm # pnpm のワークスペース（pnpm-lock.yaml）
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      # 小さな更新はまとめて1つにする。大きな版の更新は1つずつ確かめる
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 型定義は動かしている Node.js（22 LTS）に合わせる。Node.js を上げるときに一緒に上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript の大きな版は書き方が変わることがあるため、自動の提案はしない（必要なときに作業として上げる）
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directories: [/infra, /infra/backup]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      images:
        patterns: ["*"]
    ignore:
      # Node.js は長期サポート版（22）のまま。大きな版へは、作業として確かめてから上げる
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: docker
