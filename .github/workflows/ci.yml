name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # 受入条件の自動テスト（7.2: テストが通らないものは取り込まない）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    # 画面の通しテスト（iPhone・Android の大きさ）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hanamaru/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/test-results

  images:
    # 本番・検証環境のイメージが作れること（infra/）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile --target api -t hanamaru-api:ci .
      - run: docker build -f infra/Dockerfile --target web -t hanamaru-web:ci .
      - run: docker build infra/backup -t hanamaru-backup:ci
      - run: >-
          docker run --rm -v "$PWD/infra:/etc/caddy:ro"
          -e STUDENT_HOST=student.example.test -e STAFF_HOST=staff.example.test -e MANAGE_HOST=manage.example.test
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
