name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  phase0:
    # フェーズ0の検証を LibreBooking を実際に起動して流す（7.2 プルリクエストごとの自動テスト）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning phase0/verify.sh infra/librebooking/dbinit.sh
      - name: start librebooking
        run: |
          cat > .env <<ENV
          LB_DB_ROOT_PASSWORD=ci-root-${{ github.run_id }}
          LB_DATABASE_PASSWORD=ci-lb-${{ github.run_id }}
          LB_INSTALL_PASSWORD=ci-install-${{ github.run_id }}
          LB_PORT=8080
          LB_LOAD_SAMPLE_DATA=true
          LB_API_REGISTRATION_ALLOW_SELF=true
          ENV
          docker compose -f infra/librebooking/compose.yml --env-file .env up -d --wait app
      - name: verify
        run: bash phase0/verify.sh | tee verify.txt
      - name: logs on failure
        if: failure()
        run: docker compose -f infra/librebooking/compose.yml --env-file .env logs
