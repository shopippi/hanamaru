# フェーズ0（7.1）検証用の LibreBooking 一式。ダミーデータ専用。
# 起動: docker compose -f infra/librebooking/compose.yml --env-file .env up -d
# 画面: http://localhost:8080/Web  API: http://localhost:8080/Web/Services/index.php
#
# イメージはバージョンを固定する（V-11）。Docker Hub のレート制限に当たる環境では
# LB_IMAGE / MARIADB_IMAGE に mirror.gcr.io/... を指定する。

name: hanamaru-lb

services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    environment:
      MARIADB_ROOT_PASSWORD: ${LB_DB_ROOT_PASSWORD:?set LB_DB_ROOT_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # LibreBooking イメージに同梱されたスキーマを共有ボリュームへ取り出す
  schema:
    image: ${LB_IMAGE:-librebooking/librebooking:7.1.0-3.5.1}
    entrypoint: ["bash", "-c", "rm -rf /schema/* && cp -r /var/www/html/database_schema/. /schema/"]
    user: root
    volumes:
      - schema:/schema

  # 初回だけスキーマとユーザーを作る（2回目以降は何もしない）
  dbinit:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    depends_on:
      db: { condition: service_healthy }
      schema: { condition: service_completed_successfully }
    environment:
      MARIADB_ROOT_PASSWORD: ${LB_DB_ROOT_PASSWORD}
      LB_DATABASE_PASSWORD: ${LB_DATABASE_PASSWORD:?set LB_DATABASE_PASSWORD}
      LB_LOAD_SAMPLE_DATA: ${LB_LOAD_SAMPLE_DATA:-false}
    volumes:
      - schema:/schema:ro
      - ./dbinit.sh:/dbinit.sh:ro
    entrypoint: ["bash", "/dbinit.sh"]

  app:
    image: ${LB_IMAGE:-librebooking/librebooking:7.1.0-3.5.1}
    depends_on:
      dbinit: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:${LB_PORT:-8080}:8080"
    environment:
      LB_DATABASE_NAME: librebooking
      LB_DATABASE_USER: lb_user
      LB_DATABASE_PASSWORD: ${LB_DATABASE_PASSWORD}
      LB_DATABASE_HOSTSPEC: db
      LB_INSTALL_PASSWORD: ${LB_INSTALL_PASSWORD:?set LB_INSTALL_PASSWORD}
      LB_DEFAULT_TIMEZONE: Asia/Tokyo
      LB_DEFAULT_LANGUAGE: ja_jp
      LB_SCRIPT_URL: http://localhost:${LB_PORT:-8080}/Web
      LB_LOGGING_LEVEL: ${LB_LOGGING_LEVEL:-error}
      # 拡張サービス・生徒画面から呼ぶため API を有効にする（V-09）
      LB_API_ENABLED: "true"
      # 回数（クレジット）機能の検証用（V-05）
      LB_CREDITS_ENABLED: "true"
      # 検証のみ true。LibreBooking 3.5.1 では API の Users 作成が管理者でも拒否される不具合があり、
      # 代わりに Accounts（自己登録API）でユーザーを作るため（docs/phase0-report.md V-09）
      LB_API_REGISTRATION_ALLOW_SELF: ${LB_API_REGISTRATION_ALLOW_SELF:-false}
      # 検証環境では CAPTCHA を切る（本番は Turnstile を手前に置く NF-06）
      LB_REGISTRATION_CAPTCHA_ENABLED: "false"
    volumes:
      - config:/config

volumes:
  db:
  schema:
  config:
